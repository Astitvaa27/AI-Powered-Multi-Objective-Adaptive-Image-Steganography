services:
  postgres:
    image: postgres:17
    container_name: major-project-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: major_project
      POSTGRES_USER: major_project
      POSTGRES_PASSWORD: major_project_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U major_project -d major_project"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: